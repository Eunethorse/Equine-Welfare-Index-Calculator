<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equine Welfare Index Calculator — EUnetHorse Digital Tools</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --teal:#0a7864; --teal-deep:#085a4b; --lime:#a0be37; --cream:#F5F7F0; --paper:#FFFFFF;
  --ink:#12281F; --ink-soft:#4E6459; --line:#D9E0D0; --obs-bg:#F1F5EA;
  --safe:#0a7864; --safe-bg:#DCEEE6; --warn:#C8862B; --warn-bg:#F5E9D3;
  --danger:#B23B32; --danger-bg:#F3DEDA; --monitor:#B8890F; --monitor-bg:#FFF8E1;
  --c-nutrition:#a0be37; --c-health:#5EA443; --c-housing:#20763A; --c-behaviour:#0a7864;
  --font:"Fira Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#3FB596; --lime:#A9CF52; --cream:#0C1A14; --paper:#13261D; --ink:#E4EEE7; --ink-soft:#A3B8AC; --line:#2A4135; --obs-bg:#182E23;
    --safe:#4FC3A1; --safe-bg:#143A2E; --warn:#E3A857; --warn-bg:#3A2C16; --danger:#EE7B70; --danger-bg:#3D1D1A; --monitor:#E8C04A; --monitor-bg:#3A3214;
    --c-housing:#3E9A5A; --c-behaviour:#2FA58D;
  }
  :root:not([data-theme="light"]) header img.logo{background:#fff;border-radius:6px;padding:4px 8px}
}
:root[data-theme="dark"]{
  --teal:#3FB596; --lime:#A9CF52; --cream:#0C1A14; --paper:#13261D; --ink:#E4EEE7; --ink-soft:#A3B8AC; --line:#2A4135; --obs-bg:#182E23;
  --safe:#4FC3A1; --safe-bg:#143A2E; --warn:#E3A857; --warn-bg:#3A2C16; --danger:#EE7B70; --danger-bg:#3D1D1A; --monitor:#E8C04A; --monitor-bg:#3A3214;
  --c-housing:#3E9A5A; --c-behaviour:#2FA58D;
}
:root[data-theme="dark"] header img.logo{background:#fff;border-radius:6px;padding:4px 8px}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
img{max-width:100%}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}

/* top bar + header (BCS identity) */
.topbar{display:none;background:#085a4b;padding:10px 0}
.topbar-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.06em;color:#BFD6C9;gap:4px 12px;flex-wrap:wrap}
header{padding:20px 0 14px;border-bottom:3px solid var(--teal);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
header img.logo{height:48px;width:auto;display:block}
.title-block h1{font-weight:700;font-size:clamp(18px,2.5vw,24px);margin:0;color:var(--ink);line-height:1.1}
.title-block p{margin:3px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.title-block .local{display:block;font-size:13px;letter-spacing:0;text-transform:none;font-style:italic;margin-top:2px}
.lang-wrap{display:flex;align-items:center;gap:6px}
.lang-wrap label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.lang-wrap select{font-size:14px;padding:6px 8px;border-radius:4px;border:1px solid var(--teal);background:var(--paper);color:var(--ink);min-height:36px}
@media (max-width:560px){header img.logo{height:36px}}

/* intro card */
.intro-card{background:var(--paper);border:1.5px solid var(--line);border-left:4px solid var(--teal);border-radius:6px;padding:14px 16px;margin:20px 0 16px;font-size:14px;line-height:1.55;color:var(--ink-soft)}
.intro-card strong{color:var(--ink)}
.intro-card p{margin:6px 0}
.intro-card .small{font-size:12.5px}
.prov{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:12px;padding:2px 9px}

/* tabs */
.tabs{display:flex;align-items:flex-end;gap:0;margin:0 0 20px;border-bottom:1.5px solid var(--line);flex-wrap:wrap;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream)}
@media (min-width:700px){.tabs{position:sticky}}
.tab-btn{font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:14px 14px 11px;background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-soft);cursor:pointer;min-height:44px}
.tab-btn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}
.tabs .tab-acts{margin:6px 0 6px auto;display:flex;flex-wrap:wrap;gap:6px}
.btn-pair{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.tabs .tab-acts{margin:6px 0;width:100%}.tabs .tab-acts .act{flex:1 1 150px}.tab-btn{padding:12px 9px 9px;font-size:11px}}

/* buttons */
button.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:10px 16px;border-radius:4px;border:1.5px solid #085a4b;background:#085a4b;color:#F5F7F0;cursor:pointer;min-height:40px}
button.act.secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
button.act:hover{opacity:.88}
button.act[disabled]{opacity:.55;cursor:progress}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.act:not(.secondary){background:var(--lime);border-color:var(--lime);color:#085a4b}}
:root[data-theme="dark"] button.act:not(.secondary){background:var(--lime);border-color:var(--lime);color:#085a4b}
.actions{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:space-between}

/* data fields */
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 8px}
.field label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:8px 9px;font-size:14px;color:var(--ink);min-height:40px}
.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--teal)}
textarea{min-height:70px;resize:vertical;border-radius:4px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:28px 0 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* area selector */
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.area-btn{background:var(--paper);border:1.5px solid var(--line);border-top:4px solid var(--ac);border-radius:6px;padding:9px 10px;text-align:left;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:2px}
.area-btn b{font-size:14px;line-height:1.15}
.area-btn small{font-size:11.5px;color:var(--ink-soft)}
.area-btn .mini{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.area-btn .mini i{display:block;height:100%;background:var(--ac)}
.area-btn[aria-pressed="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
@media (max-width:620px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft);margin:6px 0 4px}
.progress .bar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.area-head{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.area-head h2{margin:0;font-size:20px;font-weight:700;color:var(--ink)}
.area-head span{font-size:12px;color:var(--ink-soft)}
.area-note{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 12px;font-style:italic}

/* indicator card (BCS .zone) */
.zone{background:var(--paper);border:1.5px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.zone.done{border-left-color:var(--ac)}
.zone-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.zone-name{font-weight:700;font-size:16px;line-height:1.25}
.qcode{display:inline-block;background:var(--ac);color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:2px 7px;margin-right:8px;vertical-align:2px;white-space:nowrap}
.ask{display:inline-flex;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:12px;padding:2px 10px}
.zone-name .code{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:6px;letter-spacing:.04em;white-space:nowrap}
.question{font-size:15px;margin:0 0 10px;color:var(--ink)}
.observe{background:var(--obs-bg);border-left:3px solid var(--lime);border-radius:4px;padding:10px 12px;margin:0 0 10px}
.observe .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:3px}
.observe p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.awin{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--teal);background:var(--safe-bg);border-radius:12px;padding:2px 10px}
.awin.none{color:var(--ink-soft);background:var(--line);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chips>span{margin-top:0}
.unit{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1px 9px}
.preset-note{margin:6px 0 0;font-size:12.5px;font-style:italic;color:var(--ink-soft)}
.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:20px 0 0;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--ink);background:var(--monitor-bg);border:1.5px solid var(--monitor);border-radius:6px}
.resume>span:first-child{flex:1 1 280px;min-width:0}
.resume-btns{display:flex;flex-wrap:wrap;gap:8px}
.group-note{margin:0 0 12px;padding:9px 12px;font-size:13.5px;line-height:1.45;color:var(--ink);background:var(--monitor-bg);border-left:3px solid var(--monitor);border-radius:4px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:16px;white-space:nowrap}
.b-danger{background:var(--danger-bg);color:var(--danger)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-safe{background:var(--safe-bg);color:var(--safe)}.b-monitor{background:var(--monitor-bg);color:var(--monitor)}
.b-empty{background:var(--line);color:var(--ink-soft)}
.resp{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
@media (max-width:640px){.resp.scale,.resp.freq{grid-template-columns:repeat(2,minmax(0,1fr))}}
.resp.yn{grid-template-columns:1fr 1fr}
.resp.yn button:not(.na){min-height:52px;font-size:16px}
.resp.check{grid-template-columns:1fr}
.resp.check button{text-align:left;display:flex;align-items:center;gap:10px;font-weight:400}
.resp.check .box{width:22px;height:22px;border:1.5px solid var(--ink-soft);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.resp.check button[aria-pressed="true"]{background:var(--safe-bg);border-color:var(--teal);color:var(--ink)}
.resp.check button[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:#fff}
.resp.check .nonebtn{justify-content:center;font-weight:700}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px;align-items:end}
.calc-f span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px}
.calc-f input{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:8px 9px;min-height:40px}
.calc-res{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--teal)}
@media (max-width:520px){.calc{grid-template-columns:1fr 1fr}}
.resp button{border:1.5px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 6px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:42px;line-height:1.15;color:var(--ink)}
.resp button:hover{border-color:var(--teal)}
.resp button[aria-pressed="true"]{background:#085a4b;border-color:#085a4b;color:#F5F7F0}
.resp .resp-x{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.resp button.na{font-weight:400;color:var(--ink-soft);min-height:36px}
.resp button.na[aria-pressed="true"]{background:var(--ink-soft);border-color:var(--ink-soft);color:var(--paper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .resp button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#085a4b}}

.zone-desc{margin-top:6px;font-size:13px;color:var(--ink-soft);font-style:italic;min-height:18px}
.photo-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.photo-btn{font-size:11.5px;padding:7px 10px;border-radius:4px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;min-height:36px}
.photo-btn:hover{border-color:var(--teal);color:var(--ink)}
.photo-btn.has{border-color:var(--teal);color:var(--teal)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1.5px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(8,90,75,.78);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zone textarea{margin-top:8px}

/* guide to the four settings */
details.guide{margin-top:0}
details.guide>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::after{content:"▾";color:var(--ink-soft);transition:transform .2s}
details.guide[open]>summary::after{transform:rotate(180deg)}
details.guide p{margin:7px 0 0;font-size:13.5px}
details.guide p b{color:var(--ink)}
details.guide p.free{margin-top:10px;padding:8px 11px;color:var(--ink);background:var(--monitor-bg);border-left:3px solid var(--monitor);border-radius:4px}

/* QBA scoring sheet (AWIN, 120 mm visual analogue scales) */
.qba{border:1.5px solid var(--line);border-radius:6px;margin:0 0 10px;background:var(--paper)}
.qba>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:9px 12px;min-height:44px}
.qba>summary::-webkit-details-marker{display:none}
.qba>summary::after{content:"▾";color:var(--ink-soft);transition:transform .2s}
.qba[open]>summary::after{transform:rotate(180deg)}
.qba[open]>summary{border-bottom:1px solid var(--line)}
.qba-t{font-weight:700;font-size:14.5px}
.qba-s{font-size:12.5px;color:var(--ink-soft)}
.qba-n{margin-left:auto;font-size:12px;font-weight:700;color:var(--teal);background:var(--safe-bg);border-radius:12px;padding:2px 10px;font-variant-numeric:tabular-nums}
.qba-body{padding:10px 12px 12px}
.qba-how{margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.qba-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,calc(120mm + 16px)) minmax(64px,1fr) 34px;gap:2px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.qba-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.qba-name i,.qba-tile .lab i{width:9px;height:9px;border-radius:2px;flex:none;background:var(--danger)}
.qba-row.pos .qba-name i,.qba-tile.pos .lab i{background:var(--safe)}
.qba-scale{padding:0 8px;min-width:0}
.qba-vas{position:relative;height:40px;cursor:crosshair;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:3px}
.qba-vas .trk{position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--ink)}
.qba-vas .cap{position:absolute;top:50%;width:1.5px;height:14px;background:var(--ink);transform:translateY(-50%)}
.qba-vas .cap.l{left:0}.qba-vas .cap.r{right:0}
.qba-vas .mk{position:absolute;top:50%;width:2px;height:26px;background:var(--teal);transform:translate(-50%,-50%);display:none}
.qba-vas .mk::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid var(--paper);transform:translate(-50%,-50%)}
.qba-row.set .mk{display:block}
.qba-ends{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.04em;color:var(--ink-soft);margin-top:-5px}
.qba-val{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.qba-val small{font-size:11px;font-weight:400;color:var(--ink-soft)}
.qba-row:not(.set) .qba-val{color:var(--ink-soft);font-weight:400}
.qba-clr{width:34px;height:34px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0}
.qba-clr:hover{border-color:var(--teal);color:var(--ink)}
.qba-row:not(.set) .qba-clr{visibility:hidden}
@media (max-width:640px){.qba-row{grid-template-columns:minmax(0,1fr) auto 34px}.qba-name{grid-column:1;grid-row:1}.qba-val{grid-column:2;grid-row:1}.qba-clr{grid-column:3;grid-row:1}.qba-scale{grid-column:1/-1;grid-row:2}}
.qba-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.qba-tile{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);min-width:0}
.qba-tile .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.qba-tile.bal .lab i{background:var(--teal)}
.qba-tile .big{font-size:24px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.qba-tile .big small{font-size:11.5px;font-weight:400;color:var(--ink-soft);margin-left:5px;white-space:nowrap}
.qba-tile .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.qba-tile.neg .big{color:var(--danger)}.qba-tile.pos .big{color:var(--safe)}
.qba-tile.bal .big.plus{color:var(--safe)}.qba-tile.bal .big.minus{color:var(--danger)}
.qba-balbar{grid-column:1/-1}
.qba-bar{position:relative;height:12px;border-radius:6px;background:var(--line)}
.qba-bar .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--ink-soft)}
.qba-bar .fill{position:absolute;top:0;bottom:0;border-radius:6px}
.qba-barscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.qba-res{grid-template-columns:1fr 1fr}.qba-tile.bal{grid-column:1/-1}.qba-tile:not(.bal) .big small{display:block;margin:2px 0 0}}
.qba-msg{margin:10px 0 0;font-size:12.5px;line-height:1.45;padding:6px 10px;border-radius:4px;background:var(--monitor-bg);color:var(--ink);border-left:3px solid var(--monitor)}
.qba-msg.ok{background:var(--safe-bg);border-left-color:var(--teal)}
.qba-note{margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft);font-style:italic}
.qba-credit{font-style:normal;margin-top:4px}
.qba-foot{display:flex;justify-content:flex-end;margin-top:10px}

.summary .gauge{width:170px}
.summary .gauge svg{width:100%;height:auto;display:block}
.summary .gauge .arc-fill{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.meta{font-size:13px;color:#BFD6C9;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px}
.reco{margin-top:14px;padding-top:14px;border-top:1px solid rgba(245,247,240,.2);font-size:14.5px;line-height:1.5;position:relative}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

dialog{border:0;border-radius:8px;padding:0;max-width:620px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(8,30,20,.35)}

.dlg{padding:22px 24px;max-height:76vh;overflow:auto}
.dlg h2{font-size:20px;margin:0 0 12px}
.dlg p{margin:0 0 10px;font-size:14px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,30px);opacity:0;background:#085a4b;color:#F5F7F0;padding:11px 18px;border-radius:6px;font-weight:700;font-size:14px;z-index:60;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important}}

<script id="eh-unified-header-js">
/* ===== EUnetHorse Digital Tools — unified header controller ===== */
(function(){
  var FL = {"en": "<svg viewBox=\"0 0 60 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><rect width=\"60\" height=\"40\" fill=\"#012169\"/><path d=\"M0,0L60,40M60,0L0,40\" stroke=\"#fff\" stroke-width=\"8\"/><path d=\"M0,0L60,40M60,0L0,40\" stroke=\"#C8102E\" stroke-width=\"3\"/><path d=\"M30,0V40M0,20H60\" stroke=\"#fff\" stroke-width=\"12\"/><path d=\"M30,0V40M0,20H60\" stroke=\"#C8102E\" stroke-width=\"7\"/></svg>", "de": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#FFCE00\"/><rect width=\"3\" height=\"1.333\" fill=\"#DD0000\"/><rect width=\"3\" height=\".667\" fill=\"#000\"/></svg>", "es": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#AA151B\"/><rect y=\".5\" width=\"3\" height=\"1\" fill=\"#F1BF00\"/></svg>", "fi": "<svg viewBox=\"0 0 18 11\" aria-hidden=\"true\"><rect width=\"18\" height=\"11\" fill=\"#fff\"/><rect x=\"5\" width=\"3\" height=\"11\" fill=\"#002F6C\"/><rect y=\"4\" width=\"18\" height=\"3\" fill=\"#002F6C\"/></svg>", "fr": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#EF4135\"/><rect width=\"2\" height=\"2\" fill=\"#fff\"/><rect width=\"1\" height=\"2\" fill=\"#0055A4\"/></svg>", "it": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#CE2B37\"/><rect width=\"2\" height=\"2\" fill=\"#fff\"/><rect width=\"1\" height=\"2\" fill=\"#009246\"/></svg>", "be": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#EF3340\"/><rect width=\"2\" height=\"2\" fill=\"#FDDA24\"/><rect width=\"1\" height=\"2\" fill=\"#000\"/></svg>", "pl": "<svg viewBox=\"0 0 8 5\" aria-hidden=\"true\"><rect width=\"8\" height=\"5\" fill=\"#DC143C\"/><rect width=\"8\" height=\"2.5\" fill=\"#fff\"/></svg>", "pt": "<svg viewBox=\"0 0 30 20\" aria-hidden=\"true\"><rect width=\"30\" height=\"20\" fill=\"#FF0000\"/><rect width=\"12\" height=\"20\" fill=\"#006600\"/><circle cx=\"12\" cy=\"10\" r=\"4.2\" fill=\"#FFCC00\"/><circle cx=\"12\" cy=\"10\" r=\"2.6\" fill=\"#FF0000\"/><path d=\"M10.6,8.6h2.8v2.4a1.4,1.4 0 0 1-2.8,0z\" fill=\"#fff\"/></svg>", "ro": "<svg viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#CE1126\"/><rect width=\"2\" height=\"2\" fill=\"#FCD116\"/><rect width=\"1\" height=\"2\" fill=\"#002B7F\"/></svg>"};
  var ORDER = ['en','de','es','fi','fr','it','be','pl','pt','ro'];
  var NAMES = {en:'English',de:'Deutsch',es:'Español',fi:'Suomi',fr:'Français',it:'Italiano',be:'Nederlands',pl:'Polski',pt:'Português',ro:'Română'};
  var I = {
    en:{devs:'Developed by',funded:'Funded by the European Union',dev:'Developed by {ctc} for {eh}',collab:'Collaborators',experts:'Experts',lang:'Language'},
    de:{devs:'Entwickelt von',funded:'Finanziert von der Europäischen Union',dev:'Entwickelt von {ctc} für {eh}',collab:'Mitwirkende',experts:'Experten',lang:'Sprache'},
    es:{devs:'Desarrollado por',funded:'Financiado por la Unión Europea',dev:'Desarrollado por {ctc} para {eh}',collab:'Colaboradores',experts:'Expertos',lang:'Idioma'},
    fi:{devs:'Kehittäjät',funded:'Euroopan unionin rahoittama',dev:'Kehittänyt {ctc} hankkeelle {eh}',collab:'Yhteistyössä',experts:'Asiantuntijat',lang:'Kieli'},
    fr:{devs:'Développé par',funded:"Financé par l'Union européenne",dev:'Développé par {ctc} pour {eh}',collab:'Collaborateurs',experts:'Experts',lang:'Langue'},
    it:{devs:'Sviluppato da',funded:"Finanziato dall'Unione europea",dev:'Sviluppato da {ctc} per {eh}',collab:'Collaboratori',experts:'Esperti',lang:'Lingua'},
    be:{devs:'Ontwikkeld door',funded:'Gefinancierd door de Europese Unie',dev:'Ontwikkeld door {ctc} voor {eh}',collab:'Medewerkers',experts:'Experts',lang:'Taal'},
    pl:{devs:'Opracowanie',funded:'Finansowane przez Unię Europejską',dev:'Opracowane przez {ctc} dla {eh}',collab:'Współpraca',experts:'Eksperci',lang:'Język'},
    pt:{devs:'Desenvolvido por',funded:'Financiado pela União Europeia',dev:'Desenvolvido por {ctc} para {eh}',collab:'Colaboradores',experts:'Especialistas',lang:'Idioma'},
    ro:{devs:'Dezvoltat de',funded:'Finanțat de Uniunea Europeană',dev:'Dezvoltat de {ctc} pentru {eh}',collab:'Colaboratori',experts:'Experți',lang:'Limbă'}
  };
  var IC = {en:'Content creators',de:'Inhalte erstellt von',es:'Creadores de contenido',fi:'Sisällön laatijat',fr:'Conception du contenu',it:'Autori dei contenuti',be:'Inhoud opgesteld door',pl:'Twórcy treści',pt:'Criadores de conteúdo',ro:'Autori ai conținutului'};
  Object.keys(IC).forEach(function(k){ if (I[k]) I[k].content = IC[k]; });
  var LINK_CTC = '<a href="https://www.ceteca.net" target="_blank" rel="noopener noreferrer">CTC (www.ceteca.net)</a>';
  var LINK_EH  = '<a href="https://www.eunethorse.eu" target="_blank" rel="noopener noreferrer">EUnetHorse (www.eunethorse.eu)</a>';
  function norm(c){ c=String(c||'en').toLowerCase(); return c==='nl'?'be':c; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  var st = {langs:[], cur:'en', on:null};
  function T(code){ return I[norm(code||st.cur)] || I.en; }
  function creditsHTML(code){
    var c = window.EH_CREDITS || {}, t = T(code), h = '';
    if (c.content && c.content.length) h += '<div class="eh-cr-row"><h2>'+esc(t.content)+'</h2><p>'+c.content.map(esc).join(', ')+'</p></div>';
    if (c.experts && c.experts.length) h += '<div class="eh-cr-row"><h2>'+esc(t.experts)+'</h2><p>'+c.experts.map(esc).join(', ')+'</p></div>';
    return h;
  }
  var DEVS = ['Cristina Vierna (CTC)', 'Miriam Pateiro (CTC)', 'Dr hab. Aleksandra Górecka-Bruzda'];
  function devsText(code){ return T(code).devs + ': ' + DEVS.join(', '); }
  function paint(){
    Array.prototype.forEach.call(document.querySelectorAll('.eh-devs'), function(el){ el.textContent = devsText(); });
    var t = T();
    var d = document.getElementById('ehDev'); if (d) d.innerHTML = t.dev.replace('{ctc}',LINK_CTC).replace('{eh}',LINK_EH);
    var f = document.getElementById('ehFunded'); if (f) f.textContent = t.funded + ' — Horizon Europe #101086551';
    var n = document.getElementById('ehLangs');
    if (n){ n.setAttribute('aria-label', t.lang);
      Array.prototype.forEach.call(n.querySelectorAll('.eh-lang'), function(b){ b.setAttribute('aria-pressed', norm(b.dataset.code)===norm(st.cur) ? 'true':'false'); }); }
    var html = creditsHTML();
    Array.prototype.forEach.call(document.querySelectorAll('.eh-credits[data-eh-static]'), function(el){ el.innerHTML = html; el.hidden = !html; });
    document.documentElement.setAttribute('data-eh-lang', norm(st.cur));
  }
  function build(){
    var n = document.getElementById('ehLangs'); if (!n) return;
    n.innerHTML = '';
    var list = st.langs.slice().sort(function(a,b){ return ORDER.indexOf(norm(a)) - ORDER.indexOf(norm(b)); });
    list.forEach(function(code){
      var k = norm(code), b = document.createElement('button');
      b.type = 'button'; b.className = 'eh-lang'; b.dataset.code = code;
      b.title = NAMES[k] || k.toUpperCase(); b.setAttribute('lang', k==='be'?'nl-BE':k);
      b.innerHTML = (FL[k]||'') + '<span>' + k.toUpperCase() + '</span>';
      b.addEventListener('click', function(){ st.cur = code; paint(); if (st.on) st.on(code); });
      n.appendChild(b);
    });
  }
  window.EHH = {
    init: function(o){ st.langs = o.langs || []; st.cur = o.current || st.langs[0]; st.on = o.onSelect; build(); paint(); },
    bindSelect: function(sel){
      if (typeof sel === 'string') sel = document.getElementById(sel);
      if (!sel) return;
      EHH.init({ langs: Array.prototype.map.call(sel.options, function(o){ return o.value; }).filter(Boolean),
                 current: sel.value,
                 onSelect: function(c){ sel.value = c; sel.dispatchEvent(new Event('change', {bubbles:true})); } });
      sel.addEventListener('change', function(){ if (norm(sel.value)!==norm(st.cur)) { st.cur = sel.value; paint(); } });
    },
    setActive: function(c){ if (norm(c)!==norm(st.cur)) { st.cur = c; paint(); } },
    setTitle: function(txt){ var h = document.querySelector('.eh-bar h1'); if (h && h.textContent !== txt) h.textContent = txt; },
    showCredits: function(on){ Array.prototype.forEach.call(document.querySelectorAll('.eh-credits'), function(el){ el.hidden = !on; }); },
    creditsHTML: creditsHTML,
    devsText: devsText
  };
})();
</script>

"question": "In which of these three situations does the horse stay calm or come closer?",
"help": "Do the three parts in order, as in the AWIN human–animal relationship tests. 1) From 2.5 m, walk slowly towards the box (one step per second). 2) Stand still at the door for 20 seconds with your hand on the latch. 3) Only if the horse shows no aggression, go in calmly and touch its neck and body. Touching the ears is assessed in the next question. Tick a part when the horse stays calm or comes closer; leave it unticked when the horse moves away, lays its ears back or threatens to bite or kick. A mare with a foal at foot may turn away to shield her foal: give her time, because she may come closer once she is used to a quiet person.",
"rec": "Spend time on calm, pleasant contact without work, avoid punishment and build trust step by step."
},
"es": {
"name": "Reacción ante las personas",
"question": "¿En cuáles de estas tres situaciones el caballo se mantiene tranquilo o se acerca?",
"help": "Haz las tres partes en orden, como en las pruebas AWIN de relación humano-animal. 1) Desde 2,5 m, camina despacio hacia el box (un paso por segundo). 2) Quédate quieto en la puerta 20 segundos con la mano en el pestillo. 3) Solo si el caballo no muestra agresividad, entra con calma y tócale el cuello y el cuerpo. El contacto con las orejas se valora en la pregunta siguiente. Marca una parte cuando el caballo se mantiene tranquilo o se acerca; déjala sin marcar si se aleja, pega las orejas hacia atrás o amenaza con morder o cocear. Una yegua con potro al pie puede girarse para proteger al potro: dale tiempo, porque puede acercarse cuando se acostumbre a una persona tranquila.",
"rec": "Dedica tiempo a contactos tranquilos y agradables sin trabajo, evita los castigos y construye la confianza paso a paso."
}

"name": "Reaction to an approaching person",
"question": "How does the horse react when a person walks slowly towards it and stops two horse lengths away?",
"help": "Start 10 m from the horse and walk towards it at one step per second, watching the horse and the rest of the group: a stallion may defend the group, so stop if he threatens you. Do not come closer than two horse lengths. Stop there and watch the horse for 20 seconds, waiting to see whether it comes to you; use this time for the QBA. Never touch the horse, even if it allows it. Horses that accept people are less stressed when they have to be gathered and handled.",

"rec": "Acostumbra a los caballos a la presencia tranquila de personas con visitas regulares y sosegadas, sin capturarlos, para que reunirlos y manejarlos sea menos estresante cuando haga falta."

"rec": "Get the horse used to calm touching of the ears in small steps, with rewards. Avoid ear twitches, and put on the bridle and clip the head gently."

"rec": "Acostumbra al caballo, poco a poco y con recompensas, a que le toquen las orejas con calma. Evita el acial en la oreja y pon la cabezada y esquila la cabeza con suavidad."

/* ---------- fonts (Fira Sans embedded, used on screen and in the PDF) ---------- */
function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
try{[["Regular","400","normal"],["Bold","700","normal"],["Italic","400","italic"],["BoldItalic","700","italic"]].forEach(([k,w,st])=>{const f=new FontFace("Fira Sans",b64ToBuf(FIRA[k]),{weight:w,style:st});document.fonts.add(f);f.load().catch(()=>{});});}catch(e){}

/* ---------- state ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({tab:"assess",domain:0,info:{equineId:"",evalType:"individual",role:"own",housing:"mixed",level:"1",date:today(),evaluator:"",notes:""},calc:{},qba:{},answers:{},comments:{},photos:{}});
let S=blank(); let lang="en"; const openComments=new Set();
let restored=false;   /* true while the notice about a saved assessment is shown */
let qbaOpen=true, guideOpen=true;   /* collapsible blocks keep their state while the page is open */
try{guideOpen=localStorage.getItem("ewi-guide")!=="0";}catch(e){}
function initialLang(){try{const s=localStorage.getItem("ewi-lang");if(s&&T[s])return s;}catch(e){} return "en";}
function t(k,vars){let s=(T[lang]&&T[lang][k]!=null)?T[lang][k]:(T.en[k]!=null?T.en[k]:k); if(vars) for(const v in vars) s=s.replace("{"+v+"}",vars[v]); return s;}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* text of a question; free-living assessments use the wording written for the open range when there is one */
const tx=(ind,f)=>{if(ind.free&&S.info.housing==="free"){const o=ind.free[lang]||ind.free.en;if(o&&o[f]!=null)return o[f];}return (ind.tx[lang]||ind.tx.en)[f];};
const hasIndTranslation=()=>INDICATORS.every(i=>i.tx[lang]);
const evalTitle=()=>S.info.equineId||t("type_"+S.info.evalType);
const dom=key=>DOMAINS.find(D=>D.key===key);
const refLabel=ind=>!ind.ref?t("awinNone"):ind.ref[0]==="TS"?`${t("tsLabel")} · ${ind.ref[1]}`:`AWIN · ${ind.ref[1]} · ${t("awinPage")} ${ind.ref[2]}`;
const refShort=ind=>!ind.ref?"—":ind.ref[0]==="TS"?"TS "+ind.ref[1]:"AWIN: "+ind.ref[1]+" ("+t("awinPage")+" "+ind.ref[2]+")";
const isGroup=()=>S.info.evalType!=="individual";
const isFree=()=>S.info.housing==="free";
const gmode=ind=>isGroup()&&!!ind.g;                       /* animal-based question answered for the whole group */
const vtype=ind=>gmode(ind)?"scale":(isFree()&&ind.typeFree)||ind.type;
const qText=ind=>{if(gmode(ind)){const g=(isFree()&&ind.gFree)||ind.g;return g[lang]||g.en;}
  if(isFree()&&ind.free&&(ind.free[lang]||ind.free.en).question)return tx(ind,"question");   /* range wording already speaks of all the horses */
  if(isGroup()&&ind.gq)return ind.gq[lang]||ind.gq.en;   /* same answers, worded for all the horses */
  return tx(ind,"question");};
function applicable(ind){const I=S.info,out=I.housing==="outdoor"||I.housing==="free";if(I.level!=="2"&&ind.lvl!==1)return false;if(ind.house==="indoor"&&out)return false;if(ind.house==="outdoor"&&I.housing==="indoor")return false;if(ind.house==="free"&&I.housing!=="free")return false;if(ind.noFree&&I.housing==="free")return false;if(ind.dep){const di=INDICATORS.find(x=>x.code===ind.dep),da=di&&ans(di);if(da==="no"||da==="never")return false;}return true;}
const ACTIVE=()=>INDICATORS.filter(applicable);
function optionsOf(ind){
  if(gmode(ind)) return GROUP_OPTS.map(o=>({k:o.k,l:t("g_"+o.k),p:o.p}));
  const ty=vtype(ind);
  if(ty==="yn") return [{k:"yes",l:t("yes"),p:ind.rev?0:3},{k:"no",l:t("no"),p:ind.rev?3:0}];
  if(ty==="freq") return FREQ.map(f=>({k:f.k,l:t("f_"+f.k),p:f.p}));
  if(ty==="scale") return ((isFree()&&ind.optsFree)||ind.opts).map(o=>({k:o.k,l:o[lang]||o.en,p:o.p}));
  return [];}
/* Current answer of a question. "dk" (don't know) and "na" (not applicable) are never scored.
   A stored answer that does not fit the current form of the question (individual/group, free-living) counts as unanswered. */
function ans(ind){let a=S.answers[ind.id];if(a==="dk"||a==="na")return a;
  if(vtype(ind)==="check"){if(Array.isArray(a))return a.filter(k=>ind.items.some(it=>it.k===k));a=null;}
  else if(a!=null&&!(typeof a==="string"&&optionsOf(ind).some(o=>o.k===a)))a=null;
  if(a==null&&isFree()&&ind.naFree)return "na";
  return a==null?undefined:a;}
function itemScore(ind){const a=ans(ind);if(a==null||a==="dk"||a==="na")return null;
  if(vtype(ind)==="check")return 3*a.length/ind.items.length;
  const o=optionsOf(ind).find(x=>x.k===a);return o?o.p:null;}
const critBad=ind=>{const sc=itemScore(ind);return !!ind.crit&&sc!=null&&(gmode(ind)?sc<=1:sc===0);};
function answerLabel(ind){const a=ans(ind);if(a==null)return t("notAnsweredB");if(a==="dk")return t("dk");if(a==="na")return t("na");
  if(vtype(ind)==="check")return a.length?a.map(k=>{const it=ind.items.find(x=>x.k===k);return it?(it[lang]||it.en):k;}).join("; "):t("noneOf");
  const o=optionsOf(ind).find(x=>x.k===a);return o?o.l:"";}
function scoreBadge(s){return s==null?"b-empty":s>=3?"b-safe":s>=1.5?"b-monitor":s>0?"b-warn":"b-danger";}
function boxMin(h){return BOX_MIN.find(r=>h<r[0])[1];}

/* ---------- QBA scoring sheet ----------
   AWIN Qualitative Behaviour Assessment for single-stabled horses: 13 descriptors, in the order of the protocol,
   each scored on a 120 mm visual analogue scale (distance from the left end, in mm).
   Field summary: mean of the negative terms, mean of the positive terms and net balance (positive - negative).
   The sheet is a profile of the horse and is not included in the score. It has its own card in Appropriate behaviour. */
const QBA_LEN=120, QBA_ID="EWI-QBA";
const QBA_INFO={id:QBA_ID,code:"QBA",d:"behaviour",ref:["AWIN","Qualitative Behaviour Assessment",51],
  tx:{en:{name:"Qualitative Behaviour Assessment (QBA)",help:"Watch the horse from outside the box or paddock for 30 seconds, then approach calmly and scratch the withers for 30 seconds, as in the AWIN protocol. Score the descriptors after the whole observation."},
      es:{name:"Evaluación cualitativa del comportamiento (QBA)",help:"Observa al caballo desde fuera del box o del paddock durante 30 segundos y después acércate con calma y ráscale la cruz otros 30 segundos, como en el protocolo AWIN. Puntúa los descriptores al terminar toda la observación."}},
  free:{en:{help:"Use the approach test (reaction to an approaching person): from two horse lengths, watch the horse for 20 seconds without touching it. Score the descriptors after the observation."},
        es:{help:"Usa la prueba de acercamiento (reacción ante una persona que se acerca): a dos cuerpos de caballo, observa al caballo durante 20 segundos sin tocarlo. Puntúa los descriptores al terminar la observación."}}};
const QBA=[["aggressive","neg"],["alarmed","neg"],["annoyed","neg"],["apathetic","neg"],["atease","pos"],["curious","pos"],["friendly","pos"],["fearful","neg"],["happy","pos"],["contact","pos"],["relaxed","pos"],["pushy","neg"],["uneasy","neg"]].map(([k,c])=>({k,c}));
const qbaVal=k=>{const v=S.qba&&S.qba[k];return typeof v==="number"&&v>=0&&v<=QBA_LEN?v:null;};
function qbaStats(){const st=c=>{const all=QBA.filter(q=>q.c===c),v=all.map(q=>qbaVal(q.k)).filter(x=>x!=null),sum=v.reduce((a,b)=>a+b,0);return {n:v.length,total:all.length,sum,mean:v.length?sum/v.length:null};};
  const neg=st("neg"),pos=st("pos"),n=neg.n+pos.n;return {neg,pos,n,complete:n===QBA.length,bal:neg.mean!=null&&pos.mean!=null?pos.mean-neg.mean:null};}
const qbaActive=()=>!isGroup()&&S.info.level==="2";   /* the sheet is for one horse; AWIN uses other descriptors for groups */
const num1=v=>(Math.round(v*10)/10).toFixed(1).replace(".",lang==="en"?".":",");
const signed1=v=>{const r=Math.round(v*10)/10;return (r>0?"+":r<0?"−":"")+num1(Math.abs(r));};

/* ---------- persistence (IndexedDB, this device only) ---------- */
const STORE_KEY="state-v5";
const store={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open("ewi-calculator",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}})},
  del(k){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}})}
};
let saveTimer=null;
function saveNow(){clearTimeout(saveTimer);saveTimer=null;return store.set(STORE_KEY,JSON.parse(JSON.stringify(S)));}

/* ---------- scoring ---------- */
function domainStats(key){const items=ACTIVE().filter(i=>i.d===key);let sum=0,ws=0,answered=0;
  items.forEach(i=>{if(ans(i)!=null)answered++;const s=itemScore(i);if(s!=null){sum+=s*i.w;ws+=i.w;}});
  return {total:items.length,answered,score:ws?Math.round(sum/ws/3*100):null};}
function overallScore(){const sc=DOMAINS.map(D=>domainStats(D.key).score).filter(s=>s!=null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
const levelOf=s=>LEVELS.find(L=>s>=L.min);
const answeredCount=()=>ACTIVE().filter(i=>ans(i)!=null).length;
const nullCount=()=>ACTIVE().filter(i=>ans(i)==="dk").length;
const naCount=()=>ACTIVE().filter(i=>ans(i)==="na").length;
const scoredCount=()=>ACTIVE().filter(i=>itemScore(i)!=null).length;
const priorityItems=()=>ACTIVE().filter(critBad);
function itemsLists(){const scored=ACTIVE().map(i=>({i,s:itemScore(i)})).filter(x=>x.s!=null);
  const improve=scored.filter(x=>x.s<3).sort((a,b)=>a.s-b.s||b.i.w-a.i.w).slice(0,5);
  const strengths=scored.filter(x=>x.s>=2&&!improve.includes(x)).sort((a,b)=>b.s-a.s||b.i.w-a.i.w).slice(0,5);
  return {strengths,improve};}

/* ---------- SVG helpers ---------- */
const rad=a=>a*Math.PI/180, pt=(cx,cy,r,a)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
function arc(cx,cy,r,a0,a1){const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}
const S0=120,SW=300;
function nailHoles(cx,cy,r,fill,size){return [.07,.17,.27,.37,.63,.73,.83,.93].map(f=>{const a=S0+SW*f,[x,y]=pt(cx,cy,r,a);return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${size}" ry="${size*.62}" transform="rotate(${(a+90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${fill}"/>`}).join("");}
function gaugeSVG(score,pal,animate){const cx=150,cy=150,r=106,w=40,L=score==null?null:levelOf(score),target=score==null?100:100-score;
  let s=`<svg viewBox="0 0 300 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t("overall"))}: ${score==null?"–":score}">`;
  s+=`<path d="${arc(cx,cy,r,S0,S0+SW)}" fill="none" stroke="${pal.track}" stroke-width="${w}"/>`;
  if(score!=null) s+=`<path class="arc-fill" d="${arc(cx,cy,r,S0,S0+SW)}" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="${animate?100:target}" data-target="${target}" fill="none" stroke="${pal.level(L)}" stroke-width="${w}"/>`;
  s+=nailHoles(cx,cy,r+11,pal.hole,3.3)+nailHoles(cx,cy,r-11,pal.hole,3.3);
  s+=`<text x="150" y="150" text-anchor="middle" font-family="${pal.font}" font-weight="700" font-size="56" fill="${pal.ink}">${esc(t("acr"))}</text>`;
  s+=`<text x="150" y="180" text-anchor="middle" font-family="${pal.font}" font-size="15" fill="${pal.muted}">${score==null?"–":score} / 100</text></svg>`;return s;}
function splitLabel(txt){if(txt.length<15||txt.indexOf(" ")<0)return [txt];const mid=txt.length/2;let best=-1;for(let i=0;i<txt.length;i++)if(txt[i]===" "&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i;return [txt.slice(0,best),txt.slice(best+1)];}
function radarSVG(pal){const cx=260,cy=200,R=138,angs=[-90,0,90,180],sc=DOMAINS.map(D=>domainStats(D.key).score);
  let s=`<svg viewBox="0 0 520 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t("byDomain"))}">`;
  [25,50,75,100].forEach(v=>{const p=angs.map(a=>pt(cx,cy,R*v/100,a).map(n=>n.toFixed(1)).join(",")).join(" ");s+=`<polygon points="${p}" fill="${v===100?pal.soft:"none"}" stroke="${pal.line}" stroke-width="1"/>`;});
  angs.forEach(a=>{const [x,y]=pt(cx,cy,R,a);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${pal.line}"/>`;});
  const poly=angs.map((a,i)=>pt(cx,cy,R*(sc[i]||0)/100,a).map(n=>n.toFixed(1)).join(",")).join(" ");
  s+=`<polygon points="${poly}" fill="${pal.primary}" fill-opacity=".2" stroke="${pal.primary}" stroke-width="2.5" stroke-linejoin="round"/>`;
  angs.forEach((a,i)=>{const [x,y]=pt(cx,cy,R*(sc[i]||0)/100,a);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${pal.dom(DOMAINS[i])}" stroke="${pal.bg}" stroke-width="2.5"/>`;});
  const pos=[[cx,cy-R-44,"middle"],[cx+R+16,cy-6,"start"],[cx,cy+R+30,"middle"],[cx-R-16,cy-6,"end"]];
  DOMAINS.forEach((D,i)=>{const [x,y,an]=pos[i],lines=splitLabel(t("d_"+D.key));
    s+=`<text x="${x}" y="${y}" text-anchor="${an}" font-family="${pal.font}" font-size="16" font-weight="700" fill="${pal.ink}">`+lines.map((l,j)=>`<tspan x="${x}" dy="${j?18:0}">${esc(l)}</tspan>`).join("")+`</text>`;
    s+=`<text x="${x}" y="${y+lines.length*18+6}" text-anchor="${an}" font-family="${pal.font}" font-size="20" font-weight="700" fill="${pal.dom(D)}">${sc[i]==null?"–":sc[i]}</text>`;});
  return s+`</svg>`;}
function euFlagSVG(){let s=`<svg viewBox="0 0 810 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EU emblem"><rect width="810" height="540" fill="#003399"/>`;
  for(let i=0;i<12;i++){const [cx,cy]=pt(405,270,180,i*30-90);let p=[];for(let k=0;k<10;k++){const rr=k%2?12:30;const [x,y]=pt(cx,cy,rr,k*36-90);p.push(x.toFixed(1)+","+y.toFixed(1));}s+=`<polygon points="${p.join(" ")}" fill="#FFCC00"/>`;}return s+`</svg>`;}
const DARK_PAL={track:"rgba(245,247,240,.14)",hole:"#085a4b",ink:"#F5F7F0",muted:"#9FC3AE",font:"Fira Sans, sans-serif",level:L=>({"fav":"#4FC3A1","opp":"#E8C04A","pri":"#E3A857","att":"#EE7B70"})[L.k]};
const SCREEN_PAL={ink:"var(--ink)",line:"var(--line)",soft:"var(--obs-bg)",primary:"var(--teal)",bg:"var(--paper)",font:"Fira Sans, sans-serif",dom:D=>D.color};

function fileName(kind,ext){const safe=(S.info.equineId||S.info.evalType||"assessment").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"").slice(0,40);
  return `${t("acr")}_${kind}_${safe}_${S.info.date||today()}.${ext}`;}
async function deliver(blob,filename,okKey,errKey){const dl=await getDownloads();
  if(dl){try{await dl.save({filename,data:blob});toast(t(okKey));}catch(e){toast(e&&e.code==="declined"?t("pdfDeclined"):t(errKey));}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(t(okKey));}}

/* QBA scales: click or drag on a line, or use the keyboard (arrows 1 mm, Shift 5 mm, Page 10 mm, Home, End, Delete) */
let qbaDrag=null;
const qbaFromX=(el,x)=>{const r=el.getBoundingClientRect();return r.width?Math.max(0,Math.min(1,(x-r.left)/r.width))*QBA_LEN:0;};
document.addEventListener("pointerdown",e=>{const v=e.target.closest?e.target.closest(".qba-vas"):null;if(!v||e.button>0)return;
  qbaDrag={el:v,k:v.dataset.q,prev:qbaVal(v.dataset.q),id:e.pointerId};try{v.setPointerCapture(e.pointerId);}catch(_){}
  v.focus({preventScroll:true});qbaSet(qbaDrag.k,qbaFromX(v,e.clientX));});
document.addEventListener("pointermove",e=>{if(qbaDrag&&e.pointerId===qbaDrag.id)qbaSet(qbaDrag.k,qbaFromX(qbaDrag.el,e.clientX));});
document.addEventListener("pointerup",e=>{if(qbaDrag&&e.pointerId===qbaDrag.id){qbaDrag=null;saveNow();}});
/* the touch became a page scroll: put the previous score back */
document.addEventListener("pointercancel",e=>{if(qbaDrag&&e.pointerId===qbaDrag.id){const d=qbaDrag;qbaDrag=null;qbaSet(d.k,d.prev);saveNow();}});
document.addEventListener("keydown",e=>{const v=e.target.classList&&e.target.classList.contains("qba-vas")?e.target:null;if(!v||e.altKey||e.ctrlKey||e.metaKey)return;
  const k=v.dataset.q,c=qbaVal(k)||0,step=e.shiftKey?5:1;let n;
  switch(e.key){case "ArrowLeft":case "ArrowDown":n=c-step;break;case "ArrowRight":case "ArrowUp":n=c+step;break;case "PageDown":n=c-10;break;case "PageUp":n=c+10;break;
    case "Home":n=0;break;case "End":n=QBA_LEN;break;case "Delete":case "Backspace":n=null;break;default:return;}
  e.preventDefault();qbaSet(k,n);});
document.addEventListener("toggle",e=>{const el=e.target;if(!el||!el.id)return;
  if(el.id==="qbaBox")qbaOpen=el.open;
  else if(el.id==="guideBox"){guideOpen=el.open;try{localStorage.setItem("ewi-guide",guideOpen?"1":"0");}catch(_){}}},true);
dlg.addEventListener("click",e=>{if(e.target===dlg)closeDialog();});
const sel=document.getElementById("langSel");
sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
sel.addEventListener("change",()=>{lang=sel.value;try{localStorage.setItem("ewi-lang",lang)}catch(e){}render();});

(async function(){lang=initialLang();sel.value=lang;render();getDownloads();
  if(await store.open()){const saved=await store.get(STORE_KEY);if(saved&&saved.info){S=Object.assign(blank(),saved);S.info=Object.assign(blank().info,S.info);S.calc=S.calc||{};
    ["photos","comments"].forEach(k=>{const o=S[k]||{};if(o["EWI-BEH-008"]&&!o[QBA_ID]){o[QBA_ID]=o["EWI-BEH-008"];delete o["EWI-BEH-008"];}});restored=Object.keys(S.answers||{}).length>0||Object.keys(S.qba||{}).length>0;render();}}})();
</script>
